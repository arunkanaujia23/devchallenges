<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link rel="stylesheet" href="style.css">
    <title>Minimal Blog Card | devChallenges.io</title>


  </head>
  <body>

    <main class="container">
        <div class="card">
          <div class="card-header">
            <img src="./resources/Cactus.jpg" alt=" Cactus" class="card-image" />
          </div>
            <div class="card-body">
              <div class="card-badge">Design</div>
              
              <div class="card-content">
                <h2 class="card-title">Embracing Minimalism</h2>
                <p class="card-description">
                  From minimalist sculptures to minimalist paintings, this blog will inspire you to appreciate the beauty that lies in simplicity. </p>
              </div>
              <div class="card-footer">
                
                  
                  <p class="author-name">Annie Spratt</p>
                
                
            </div>
           
        </div>
    </main>
    

    <div class="author-info">
      Coded by <a href="https://github.com/arunkanaujia23">Arun Kanaujia</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
  </body>
</html>
